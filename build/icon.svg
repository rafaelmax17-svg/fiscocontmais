<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5ef0"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- rounded square badge -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#bg)" filter="url(#sh)"/>

  <!-- subtle inner sheen -->
  <rect x="40" y="40" width="432" height="216" rx="104" fill="#ffffff" opacity="0.06"/>

  <!-- donut ring (contábil / análise) -->
  <g transform="translate(256 244)">
    <circle r="118" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="34"/>
    <!-- animated-looking arc, ~72% -->
    <circle r="118" fill="none" stroke="url(#ring)" stroke-width="34"
            stroke-linecap="round"
            stroke-dasharray="534 741" stroke-dashoffset="0"
            transform="rotate(-90)"/>
    <!-- accent arc (segment) -->
    <circle r="118" fill="none" stroke="#a5b4fc" stroke-width="34"
            stroke-linecap="round"
            stroke-dasharray="150 591" stroke-dashoffset="-534"
            transform="rotate(-90)"/>
    <!-- check mark inside -->
    <path d="M -46 4 L -14 40 L 52 -34" fill="none" stroke="#ffffff" stroke-width="30"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- plus badge -->
  <g transform="translate(388 132)">
    <circle r="52" fill="#ffffff"/>
    <path d="M 0 -26 V 26 M -26 0 H 26" stroke="#4f46e5" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
