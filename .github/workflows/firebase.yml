name: Publicar funções e regras no Firebase

# Publica as Cloud Functions (functions/) e as Regras do Firestore (firestore.rules) no projeto fiscocontmais.
# Roda sozinho quando essas pastas mudam no main, e também a mão (Actions > Publicar funções > Run workflow).
# Precisa do segredo FIREBASE_SERVICE_ACCOUNT (chave JSON da conta de serviço github-deploy).
on:
  push:
    branches: [main]
    paths: ['functions/**', 'firestore.rules', 'firebase.json', '.github/workflows/firebase.yml']
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Dependências das funções
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: Credencial do Firebase
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Segredo FIREBASE_SERVICE_ACCOUNT não configurado."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Publicar funções e regras
        shell: bash
        run: |
          set +e
          # regras primeiro e sozinhas: não dependem de faturamento, então saem mesmo se as funções falharem
          npx --yes firebase-tools@15 deploy --only firestore:rules --project fiscocontmais --non-interactive --force 2>&1 | tee deploy.log
          st=${PIPESTATUS[0]}
          if [ "$st" = "0" ]; then echo "::notice title=Regras do Firestore::publicadas"; fi
          npx --yes firebase-tools@15 deploy --only functions --project fiscocontmais --non-interactive --force 2>&1 | tee -a deploy.log
          st2=${PIPESTATUS[0]}
          [ "$st" = "0" ] && st=$st2
          if [ "$st" != "0" ]; then
            # resumo do erro como anotação (aparece no resumo da execução, sem precisar abrir o log inteiro)
            msg=$(grep -iE "error|denied|permission|not enabled|failed|billing|forbidden|403|unable" deploy.log | grep -v "^npm" | tail -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Falha ao publicar no Firebase::${msg:0:3800}"
            tail -60 deploy.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-3800 | sed 's/^/::warning title=Final do log::/'
          fi
          exit $st

      - name: Apagar a credencial
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
