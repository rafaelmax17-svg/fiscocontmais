name: Narracao do video (temporario)
permissions:
  contents: write
on:
  push:
    branches: [video-narracao]
    paths: ['narracao/textos.json']
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install google-auth requests
      - run: python narracao/tts.py
      - name: Devolver os áudios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f narracao/saida && git commit -m "Narração (temporário)" && git push
