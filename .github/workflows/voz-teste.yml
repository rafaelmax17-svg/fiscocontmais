name: Verificacao temporaria
on:
  push:
    branches: [voz-teste]
    paths: ['verif/cest.py', '.github/workflows/voz-teste.yml']
permissions:
  contents: write
jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Tabela CEST
        run: sudo apt-get install -y -qq poppler-utils && python verif/cest.py
      - name: Devolver
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f verif/cest_oficial.json; git add -f verif/pb0.txt verif/pb1.txt || true; git commit -m "Tabela CEST (temporario)" && git push
