name: Verificacao temporaria
on:
  push:
    branches: [voz-teste]
    paths: ['verif/agenda.py', '.github/workflows/voz-teste.yml']
jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Ler agenda (somente leitura)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          pip install -q google-cloud-firestore
          python verif/agenda.py
          rm -f "$RUNNER_TEMP/sa.json"
