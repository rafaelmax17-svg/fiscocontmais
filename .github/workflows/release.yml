name: Gerar instalador e publicar a versão

# Roda sozinho quando uma tag de versao (v2.1.1, v2.1.2...) e enviada ao GitHub (o Claude envia a tag quando a versao
# fica pronta). Tambem pode ser rodado a mao (Actions > Gerar instalador > Run workflow) informando a tag.
# Desde a 2.1.1 a versao e PUBLICADA direto no repositorio de instaladores (fiscocontmais-releases), de onde os
# computadores baixam a atualizacao: nao ha mais rascunho para publicar a mao.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da versao (ex.: v1.5.6)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # Aceita a tag digitada com pequenos erros (1.8.0, V1.8.0, v.1.8.0, com espaco) e padroniza para v1.8.0.
      - name: Padronizar a tag informada
        shell: bash
        run: |
          T="$(printf '%s' "$TAG" | tr -d '[:space:]')"
          T="${T#[vV]}"; T="${T#.}"
          if ! printf '%s' "$T" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag invalida: '$TAG'. Use o formato v1.8.0."
            exit 1
          fi
          [ "v$T" != "$TAG" ] && echo "Tag '$TAG' padronizada para 'v$T'."
          echo "TAG=v$T" >> "$GITHUB_ENV"

      # Rodando a mao: se a tag ainda nao existe, cria a partir do commit escolhido (main); se existe, usa a tag.
      - name: Preparar a tag da versao
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG ja existe; usando o codigo dela."
            git checkout "refs/tags/$TAG"
          else
            echo "Tag $TAG nao existe; criando a partir de $(git rev-parse --short HEAD)."
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Conferir a versao do package.json
        shell: bash
        run: |
          V_PKG=$(node -p "require('./package.json').version")
          if [ "v$V_PKG" != "$TAG" ]; then
            echo "::error::A tag $TAG nao bate com a versao do package.json ($V_PKG). Rode de novo informando v$V_PKG."
            exit 1
          fi
          echo "Versao $V_PKG confere com a tag $TAG."

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Dependencias Python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pdfplumber reportlab requests cryptography python-docx pillow openpyxl
          if [ -f python/requirements.txt ]; then python -m pip install -r python/requirements.txt; fi

      - name: Compilar os nucleos Python (exe)
        shell: bash
        run: |
          mkdir -p pydist
          cd python
          for n in fiscal_core balancete_core extrato_core; do
            echo "== $n"
            python -m PyInstaller --onefile --console --noconfirm --clean --name $n \
              --distpath ../pydist --workpath ../pybuild/work_$n --specpath ../pybuild/spec_$n \
              --paths . \
              --hidden-import auditoria_am --hidden-import st_am_dados --hidden-import oportunidades --hidden-import legalizacao --hidden-import efd_cliente --hidden-import efd_contribuicoes \
              --hidden-import efd_corretor --hidden-import efd_reducao_linear --hidden-import efd_lc224_excecoes --hidden-import efd_conferencia --hidden-import efd_tabelas_natureza_dados \
              --hidden-import nfse_danfse --hidden-import manifestacao --hidden-import nfse_lote --hidden-import nfse_pdf_dados \
              --hidden-import difal_ro --hidden-import simples_ro --hidden-import corretor_dash --hidden-import xml_entradas --hidden-import tabela_ajustes_dados --hidden-import evolucao_tributaria --hidden-import monofasico --hidden-import lote_sped --hidden-import icms_xml --hidden-import lmc --hidden-import icms_credito --hidden-import danfe --hidden-import valor_xml --hidden-import estoque_st --hidden-import openpyxl \
              --collect-all pdfplumber --collect-all pdfminer --collect-all reportlab \
              $n.py
          done
          ls -la ../pydist

      - name: Dependencias do app
        shell: bash
        run: npm ci

      - name: Gerar o instalador
        shell: bash
        run: npx electron-builder --win nsis --publish never

      - name: Conferir arquivos gerados
        shell: bash
        run: |
          ls -la dist
          V="${TAG#v}"
          test -f "dist/fiscocont-plus-setup-$V.exe"
          test -f "dist/fiscocont-plus-setup-$V.exe.blockmap"
          test -f dist/latest.yml
          grep -q "version: $V" dist/latest.yml

      - name: Publicar a versao no repositorio de instaladores (fiscocontmais-releases)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Segredo RELEASES_TOKEN nao configurado: a versao nao foi publicada."
            exit 1
          fi
          V="${TAG#v}"
          NOTES="release-notes/$TAG.md"
          mkdir -p release-notes
          [ -f "$NOTES" ] || echo "Ajustes internos e melhorias de desempenho." > "$NOTES"
          R=rafaelmax17-svg/fiscocontmais-releases
          ARQS=("dist/fiscocont-plus-setup-$V.exe" "dist/fiscocont-plus-setup-$V.exe.blockmap" dist/latest.yml)
          if gh release view "$TAG" -R "$R" >/dev/null 2>&1; then
            echo "Ja existe a release $TAG em $R: atualizando os arquivos e publicando."
            gh release upload "$TAG" -R "$R" "${ARQS[@]}" --clobber
            gh release edit "$TAG" -R "$R" --draft=false --title "$TAG" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" -R "$R" --title "$TAG" --notes-file "$NOTES" --latest "${ARQS[@]}"
          fi
          echo "::notice title=Versao publicada::$TAG publicada em https://github.com/$R/releases/tag/$TAG"
